<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paiement confirmé — KEFONA</title><style>body{font-family:system-ui;margin:0;background:#17110c;color:#f5ead7;display:grid;place-items:center;min-height:100vh}.box{max-width:560px;padding:36px;text-align:center;border:1px solid #b8893c;border-radius:18px;background:#241a12}.ok{font-size:48px}.mini{opacity:.8;font-size:.9rem}a{display:inline-block;margin-top:20px;padding:12px 20px;border-radius:10px;background:#c99a4a;color:#17110c;text-decoration:none;font-weight:700}</style></head><body><div class="box"><div class="ok">✓</div><h1>Paiement reçu</h1><p id="msg">Vérification du paiement en cours…</p><p class="mini" id="ref"></p><a href="/">Retour au site</a></div><script>
const ref=new URLSearchParams(location.search).get('reference');document.getElementById('ref').textContent=ref?'Commande '+ref:'';
async function verify(){if(!ref)return;try{const r=await fetch('/api/payment-status?reference='+encodeURIComponent(ref),{cache:'no-store'});const d=await r.json();if(d.linkStatus==='PAID'&&d.paymentStatus==='SUCCESS'){
 const orders=JSON.parse(localStorage.getItem('kefona_orders')||'[]');const o=orders.find(x=>x.id===ref);if(o){o.paymentStatus='Payé';if(d.paymentMethod)o.paymentMethod=d.paymentMethod;localStorage.setItem('kefona_orders',JSON.stringify(orders));}
 try{if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'KEFONA_PAYMENT_CONFIRMED',reference:ref,paymentMethod:d.paymentMethod||null},location.origin)}}catch(e){}
 document.getElementById('msg').textContent='Paiement confirmé. Retour vers KEFONA…';setTimeout(()=>{try{window.close()}catch(e){}location.href='/?payment=success&reference='+encodeURIComponent(ref)},500);
 }else if(d.paymentStatus==='FAILED'){document.getElementById('msg').textContent='Le paiement a échoué. Vous pouvez revenir sur KEFONA et réessayer.';}else{document.getElementById('msg').textContent='Paiement reçu, confirmation en cours…';setTimeout(verify,2000)}}catch(e){document.getElementById('msg').textContent='Vérification en cours…';setTimeout(verify,2500)}}verify();
</script></body></html>
