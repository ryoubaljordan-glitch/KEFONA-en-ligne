<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paiement confirmé — KEFONA en ligne</title><style>body{font-family:Arial,sans-serif;background:#15100c;color:#fff;text-align:center;padding:48px 20px}main{max-width:520px;margin:auto;background:#241a12;border-radius:18px;padding:30px}h1{color:#d8aa52}.muted{color:#cbbfae}button{background:#d8aa52;border:0;border-radius:10px;padding:13px 20px;font-weight:700}</style></head><body><main><h1>Paiement confirmé</h1><p id="msg" class="muted">Vérification du paiement en cours…</p><button onclick="location.href='/'">Retour à KEFONA</button></main><script>
(async()=>{const ref=new URLSearchParams(location.search).get('reference');if(!ref){document.getElementById('msg').textContent='Référence de commande manquante.';return}for(let i=0;i<10;i++){try{const r=await fetch('/api/payment-status?reference='+encodeURIComponent(ref),{cache:'no-store'});if(r.ok){const d=await r.json();if(d.linkStatus==='PAID'&&d.paymentStatus==='SUCCESS'){try{const orders=JSON.parse(localStorage.getItem('kefona_orders')||'[]');const o=orders.find(x=>x.id===ref);if(o){o.paymentStatus='Payé';if(d.paymentMethod)o.paymentMethod=d.paymentMethod;localStorage.setItem('kefona_orders',JSON.stringify(orders));localStorage.setItem('kefona_cart','{}')}}catch(e){}document.getElementById('msg').textContent='Paiement confirmé. Votre commande est enregistrée.';setTimeout(()=>location.href='/?payment=success&reference='+encodeURIComponent(ref),700);return}}}catch(e){}await new Promise(r=>setTimeout(r,1000))}document.getElementById('msg').textContent='Le paiement n’a pas encore pu être confirmé. Revenez sur KEFONA et consultez votre commande.'})();
</script></body></html>
