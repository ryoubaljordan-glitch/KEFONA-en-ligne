<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paiement réussi — KEFONA</title><style>body{font-family:system-ui;margin:0;background:#17110c;color:#f5ead7;display:grid;place-items:center;min-height:100vh}.box{max-width:560px;padding:36px;text-align:center;border:1px solid #b8893c;border-radius:18px;background:#241a12}a{display:inline-block;margin-top:20px;padding:12px 20px;border-radius:10px;background:#c99a4a;color:#17110c;text-decoration:none;font-weight:700}.mini{opacity:.8;font-size:.9rem}</style></head><body><div class="box"><h1>Paiement reçu</h1><p id="msg">Vérification du paiement en cours…</p><p class="mini" id="ref"></p><a href="/">Retour au site</a></div><script>const ref=new URLSearchParams(location.search).get('reference');document.getElementById('ref').textContent=ref?'Commande '+ref:'';async function verify(){if(!ref)return;try{const r=await fetch('/api/payment-status?reference='+encodeURIComponent(ref),{cache:'no-store'});const d=await r.json();const orders=JSON.parse(localStorage.getItem('kefona_orders')||'[]');const o=orders.find(x=>x.id===ref);if(o&&d.paymentStatus==='SUCCESS'&&d.linkStatus==='PAID'){o.paymentStatus='Payé';if(d.paymentMethod)o.paymentMethod=d.paymentMethod;localStorage.setItem('kefona_orders',JSON.stringify(orders));document.getElementById('msg').textContent='Paiement confirmé. Votre commande est enregistrée chez KEFONA en ligne.';}else if(d.paymentStatus==='FAILED'){document.getElementById('msg').textContent='Le paiement a échoué. Vous pouvez revenir au site et réessayer.';}else{document.getElementById('msg').textContent='Paiement reçu, confirmation en cours…';}}catch(e){document.getElementById('msg').textContent='Paiement reçu. La confirmation sera vérifiée au retour sur le site.';}}verify();</script></body></html>
