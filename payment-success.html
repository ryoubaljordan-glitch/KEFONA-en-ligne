<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paiement reçu — KEFONA en ligne</title><style>body{font-family:Arial,sans-serif;background:#100905;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:560px;padding:32px;text-align:center;border:1px solid #b58a32;border-radius:18px;background:#1b100a}h1{color:#d8ad52}a,button{display:inline-block;margin-top:20px;padding:12px 20px;background:#d8ad52;color:#170d06;text-decoration:none;border:0;border-radius:10px;font-weight:700;font-size:15px}.mini{opacity:.75;font-size:13px;line-height:1.5}</style></head><body><main class="box"><h1 id="title">Vérification du paiement…</h1><p id="msg">Nous vérifions automatiquement le statut auprès de Papi.</p><p class="mini" id="ref"></p><a id="back" href="/">Retour au site</a></main><script>
const params=new URLSearchParams(location.search);const reference=params.get('reference')||'';document.getElementById('ref').textContent=reference?'Commande '+reference:'';
async function verify(){if(!reference){document.getElementById('title').textContent='Paiement reçu';document.getElementById('msg').textContent='Merci pour votre commande chez KEFONA en ligne.';return true}try{const r=await fetch('/api/payment-status?reference='+encodeURIComponent(reference),{cache:'no-store'});if(!r.ok)return false;const d=await r.json();if(d.linkStatus==='PAID'&&d.paymentStatus==='SUCCESS'){
 const orders=JSON.parse(localStorage.getItem('kefona_orders')||'[]');let changed=false;for(const o of orders){if(o&&o.id===reference){o.paymentStatus='Payé';if(d.paymentMethod)o.paymentMethod=d.paymentMethod;changed=true}}if(changed)localStorage.setItem('kefona_orders',JSON.stringify(orders));localStorage.setItem('kefona_last_payment',JSON.stringify({reference,paymentStatus:'SUCCESS',paymentMethod:d.paymentMethod||null,at:new Date().toISOString()}));document.getElementById('title').textContent='Paiement confirmé ✓';document.getElementById('msg').textContent='Votre paiement a bien été confirmé. Votre commande est enregistrée chez KEFONA en ligne.';return true}
 if(d.paymentStatus==='FAILED'){document.getElementById('title').textContent='Paiement non confirmé';document.getElementById('msg').textContent=d.message||'Le paiement a échoué ou a été refusé. Vous pouvez revenir au site et réessayer.';return true}
}catch(e){}return false}
(async()=>{for(let i=0;i<5;i++){if(await verify())break;await new Promise(r=>setTimeout(r,2500));}})();
</script></body></html>
